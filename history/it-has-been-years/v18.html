<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>It Has Been Years</title>
<style>
:root{--ink:#0f4c57;--paper:#f6fcfc;--soft:#4d8b94}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#cfeff3;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;color:var(--ink);touch-action:none}
canvas{display:block;position:fixed;inset:0}
#white{position:fixed;inset:0;background:var(--paper);opacity:1;pointer-events:none;transition:opacity 1.8s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 10vw;z-index:3}
#white.off{opacity:0}
#yrs{font-size:clamp(22px,6.4vw,40px);font-weight:200;letter-spacing:.05em;opacity:0;transition:opacity 1.6s ease}
#sub{margin-top:1.3em;font-size:clamp(13px,3.6vw,16px);letter-spacing:.08em;color:var(--soft);opacity:0;transition:opacity 2s ease 1.2s}
#white.txt #yrs,#white.txt #sub{opacity:1}
#dbg button{font-size:11px;letter-spacing:.05em;padding:.35em .55em;background:rgba(246,252,252,.88);border:1px solid #0f4c57;color:#0f4c57}
#hint{position:fixed;left:0;right:0;bottom:15%;text-align:center;font-size:clamp(15px,4vw,19px);letter-spacing:.14em;color:var(--ink);text-shadow:0 0 10px #f6fcfc,0 0 3px #f6fcfc;opacity:0;transition:opacity 2.4s ease;pointer-events:none;z-index:2}
#hint.on{opacity:.9}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid rgba(15,76,87,.4);display:none;pointer-events:none;z-index:1}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.35);border:1px solid rgba(15,76,87,.5)}
#start,#end{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:9vw;background-color:#f1fafa;background-image:linear-gradient(#c6e8ec 1px,transparent 1px),linear-gradient(90deg,#c6e8ec 1px,transparent 1px);background-size:40px 40px}
#end{display:none;opacity:0;transition:opacity 3.5s ease;z-index:6;background-image:none;background-color:#f6fcfc}
h1{font-weight:200;font-size:clamp(34px,10vw,64px);letter-spacing:.04em;margin:0 0 .5em;color:var(--ink)}
.how{font-size:clamp(14px,3.8vw,17px);line-height:1.8;color:var(--soft);margin:0 0 2.6em;max-width:22em;background:rgba(241,250,250,.88);padding:.4em .8em}
button{font:inherit;font-weight:300;font-size:17px;letter-spacing:.22em;color:var(--ink);background:rgba(246,252,252,.9);border:1px solid var(--ink);padding:.9em 2.4em;border-radius:0;cursor:pointer}
button:active{background:#d8f1f3}
@media (prefers-reduced-motion:reduce){#white,#yrs,#sub{transition-duration:.3s}}
</style>
</head>
<body>
<div id="joy"><div id="knob"></div></div>
<div id="dbg" style="position:fixed;top:8px;left:8px;z-index:9;display:flex;flex-wrap:wrap;gap:4px;max-width:210px;font-size:11px">
  <span style="width:100%;letter-spacing:.12em;color:#0f4c57">TEMP STAGES</span>
  <button data-c="W0">W0</button><button data-c="W1">W1</button><button data-c="W2">W2</button><button data-c="W3">W3</button>
  <button data-c="C0">C0</button><button data-c="C1">C1</button><button data-c="C2">C2</button><button data-c="C3">C3</button><button data-c="C4">C4</button>
  <button data-c="TOP">TOP</button><button data-c="TIP">TIP</button><button data-c="SPEED" style="width:100%">SPEED: OFF</button>
</div>
<div id="hint">Walk toward the tower.</div>
<div id="white"><div id="yrs"></div><div id="sub"></div></div>

<div id="start">
  <h1>It has been years.</h1>
  <p class="how">Walk toward the tower.<br>Left thumb walks. Right thumb looks.<br>Keyboard: WASD, drag the mouse to look.<br>Headphones help.</p>
  <button id="go">BEGIN</button>
</div>

<div id="end">
  <h1>It has been years.</h1>
  <p class="how">You reached the top.<br>It is much bigger from here.<br>There are others.</p>
  <button id="again">WALK AGAIN</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const OCEAN_Y = -2.2;
const SUN = new THREE.Vector3(0.35, 0.62, 0.7).normalize();

/* ---------- renderer: two passes so a 1000 km tower and a 1 m tile can share a frame ---------- */
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }); }
catch (e) { document.body.innerHTML = '<p style="padding:12vw">This needs WebGL, which is not available here.</p>'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
document.body.prepend(renderer.domElement);
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const FOV = 70;
let spireMesh = null, beaconMesh = null, seaG = null;
const towerRings = [];
const scene = new THREE.Scene();                 // the near world
const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.15, 60000);
camera.rotation.order = "YXZ";
const tScene = new THREE.Scene();                // the far world: sky, ocean, tower
const tCam = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 1e6, 3e8);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xbfe6ff, 0x86dce3, 0.62));
const sunL = new THREE.DirectionalLight(0xfff4e0, 0.92); sunL.position.copy(SUN).multiplyScalar(100); scene.add(sunL);
tScene.add(new THREE.HemisphereLight(0xcfeaff, 0x9be4ea, 0.75));
const sunT = new THREE.DirectionalLight(0xfff4e0, 0.95); sunT.position.copy(SUN).multiplyScalar(1e6); tScene.add(sunT);
tScene.fog = new THREE.FogExp2(0xcfe9f4, 5e-8);

/* ---------- shared GLSL ---------- */
const SKY_GLSL = `
vec3 skyColor(vec3 d){
  float h = clamp(d.y, 0.0, 1.0);
  vec3 hor = vec3(0.80, 0.93, 0.98);
  vec3 zen = vec3(0.16, 0.48, 0.88);
  vec3 c = mix(hor, zen, pow(h, 0.5));
  vec3 sp = vec3(0.004, 0.009, 0.026) + hor * 0.45 * exp(-abs(d.y) * 40.0);
  c = mix(c, sp, space);
  float s = max(dot(d, sunDir), 0.0);
  c += vec3(1.0, 0.95, 0.8) * (pow(s, 1200.0) * 6.0 + pow(s, 28.0) * 0.28 * (1.0 - space));
  vec3 q = floor(d * 300.0);
  float r = fract(sin(dot(q, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
  c += vec3(1.0) * step(0.9978, r) * space;
  return c;
}`;
const sunU = { value: SUN };
const spaceU = { value: 0 };
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { sunDir: sunU, space: spaceU },
  vertexShader: "varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
  fragmentShader: "uniform vec3 sunDir; uniform float space; varying vec3 vD;" + SKY_GLSL + "void main(){ gl_FragColor = vec4(skyColor(normalize(vD)),1.0); }"
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(5e7, 32, 16), skyMat); sky.renderOrder = -10; tScene.add(sky);

const timeU = { value: 0 };
const reflU = { value: null }, resU = { value: new THREE.Vector2(1, 1) }, useReflU = { value: 0 };
function waterMaterial(planar) {
  return new THREE.ShaderMaterial({
    fog: false,
    uniforms: { time: timeU, sunDir: sunU, space: spaceU, tRefl: reflU, uRes: resU, uUse: planar ? useReflU : { value: 0 } },
    vertexShader: "varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }",
    fragmentShader: `uniform float time; uniform vec3 sunDir; uniform float space; uniform sampler2D tRefl; uniform vec2 uRes; uniform float uUse; varying vec3 vW;` + SKY_GLSL + `
void main(){
  vec3 V = normalize(cameraPosition - vW);
  float dist = length(cameraPosition - vW);
  float amp = 0.004 / (1.0 + dist * 0.003);
  vec2 p = vW.xz;
  float dx = cos(p.x*0.7 + time*0.8)*0.5 + cos((p.x+p.y)*1.3 - time*1.1)*0.35 + cos(p.y*2.1 + time*1.6)*0.25;
  float dz = cos(p.y*0.6 + time*0.7)*0.5 + cos((p.x-p.y)*1.1 + time*0.9)*0.35 + cos(p.x*2.3 - time*1.4)*0.25;
  vec3 N = normalize(vec3(-dx*amp*6.0, 1.0, -dz*amp*6.0));
  float cosT = max(dot(N, V), 0.0);
  float f = 0.03 + 0.3 * pow(1.0 - cosT, 4.0);
  vec3 R = reflect(-V, N); R.y = abs(R.y);
  vec3 refl = skyColor(R);
  if (uUse > 0.5) {
    vec2 suv = gl_FragCoord.xy / uRes;
    vec2 ruv = vec2(suv.x + N.x * 0.12, 1.0 - suv.y + N.z * 0.12);
    float br = clamp(0.0012 + dist * 0.000012, 0.0012, 0.012);
    refl = (texture2D(tRefl, clamp(ruv, 0.003, 0.997)).rgb * 2.0 + texture2D(tRefl, clamp(ruv + vec2(br, 0.0), 0.003, 0.997)).rgb + texture2D(tRefl, clamp(ruv - vec2(br, 0.0), 0.003, 0.997)).rgb
            + texture2D(tRefl, clamp(ruv + vec2(0.0, br * 1.5), 0.003, 0.997)).rgb + texture2D(tRefl, clamp(ruv - vec2(0.0, br * 1.5), 0.003, 0.997)).rgb) / 6.0;
    refl *= 0.88;
  }
  vec3 body = vec3(0.1, 0.32, 0.4) + vec3(0.01, 0.035, 0.04) * (0.5 + 0.5 * dx);
  vec3 col = mix(body, refl, f);
  float sg = max(dot(R, sunDir), 0.0);
  col += vec3(1.0, 0.96, 0.85) * pow(sg, 160.0) * 0.06;
  gl_FragColor = vec4(col, 1.0);
}`
  });
}
const seaNear = new THREE.Mesh(new THREE.PlaneGeometry(80000, 80000), waterMaterial(true));
seaNear.rotation.x = -Math.PI / 2; seaNear.position.y = OCEAN_Y; scene.add(seaNear);
const seaFar = new THREE.Mesh(new THREE.PlaneGeometry(8e8, 8e8), waterMaterial(true));
seaFar.rotation.x = -Math.PI / 2; seaFar.position.y = OCEAN_Y; tScene.add(seaFar);

/* ---------- textures ---------- */
function canvasTex(w, h, draw, rx, ry) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx || 1, ry || 1); t.anisotropy = ANISO; return t;
}
let seed = 20240607;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function tileTex(base, grout, spread) {
  return canvasTex(256, 256, (g) => {
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
      const v = 1 - Math.random() * spread;
      g.fillStyle = `rgb(${base[0] * v | 0},${base[1] * v | 0},${base[2] * v | 0})`; g.fillRect(i * 128, j * 128, 128, 128);
      g.fillStyle = "rgba(255,255,255,.35)"; g.fillRect(i * 128 + 4, j * 128 + 4, 120, 3); g.fillRect(i * 128 + 4, j * 128 + 4, 3, 120);
    }
    g.strokeStyle = grout; g.lineWidth = 5; g.strokeRect(0, 0, 256, 256); g.beginPath(); g.moveTo(128, 0); g.lineTo(128, 256); g.moveTo(0, 128); g.lineTo(256, 128); g.stroke();
  });
}
const tileW = new THREE.MeshLambertMaterial({ map: tileTex([240, 247, 247], "#a9d3d8", 0.05) });
const tileA = new THREE.MeshLambertMaterial({ map: tileTex([120, 214, 222], "#bdf1f4", 0.07) });
const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const chromeMat = new THREE.MeshLambertMaterial({ color: 0xdfe9ee });
const poolWater = waterMaterial(false);
const causticTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
  g.strokeStyle = "rgba(190,255,255,.9)"; g.shadowColor = "rgba(190,255,255,1)"; g.shadowBlur = 6; g.lineWidth = 2;
  for (let i = 0; i < 26; i++) { g.beginPath(); const x = Math.random() * w, y = Math.random() * h; g.moveTo(x, y); g.bezierCurveTo(x + 40, y - 30, x + 70, y + 40, x + 110, y + 8); g.stroke(); g.moveTo(x - w, y); }
}, 3, 3);
const causticMat = new THREE.MeshBasicMaterial({ map: causticTex, transparent: true, blending: THREE.AdditiveBlending, opacity: 0.55, depthWrite: false });
const shadeTex = canvasTex(64, 64, (g) => { g.shadowColor = "rgba(0,50,70,1)"; g.shadowBlur = 12; g.fillStyle = "rgba(0,50,70,1)"; g.fillRect(16, 16, 32, 32); }, 1, 1);
shadeTex.wrapS = shadeTex.wrapT = THREE.ClampToEdgeWrapping;
const shadeMat = new THREE.MeshBasicMaterial({ map: shadeTex, transparent: true, opacity: 0.3, depthWrite: false });
const unitPlane = new THREE.PlaneGeometry(1, 1); unitPlane.userData.shared = true;

/* ---------- geometry helpers: tile-sized UVs on anything ---------- */
function tbox(w, h, d, mat, rs) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  const dm = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * dm[f][0] / rs, uv.getY(k) * dm[f][1] / rs); }
  return new THREE.Mesh(g, mat);
}
function tcyl(rt, rb, h, seg, mat, rs) {
  const g = new THREE.CylinderGeometry(rt, rb, h, seg), uv = g.attributes.uv, c = Math.PI * (rt + rb);
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * c / rs, uv.getY(i) * h / rs);
  return new THREE.Mesh(g, mat);
}
function slab(g, w, h, d, x, y, z, mat, rs) { const m = tbox(w, h, d, mat || tileW, rs || 0.6); m.position.set(x, y, z); g.add(m); return m; }
function pillar(g, r, h, x, y, z, mat, rs) { const m = tcyl(r, r, h, 14, mat || tileW, rs || 0.6); m.position.set(x, y, z); g.add(m); return m; }
function shade(g, w, d, x, z) {
  const m = new THREE.Mesh(unitPlane, shadeMat); m.rotation.x = -Math.PI / 2; m.scale.set(w, d, 1); m.position.set(x, OCEAN_Y + 0.05, z); g.add(m);
}
function disposeGroup(g) { g.traverse(o => { if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose(); }); }

/* ---------- path segments ---------- */
function deck(g, z0, L) {
  const zc = z0 - L / 2;
  slab(g, 8, 1.2, L, 0, -0.6, zc);
  [-1, 1].forEach(s => slab(g, 0.4, 0.55, L, s * 3.8, 0.275, zc));
  slab(g, 1.0, 0.05, L, 0, 0.02, zc, tileA);
  for (let z = z0 - 6; z > z0 - L + 3; z -= 14) slab(g, 1.8, 10.8, 1.8, 0, -6.6, z);
  shade(g, 15, L + 6, 0, zc);
}
function buildWalk(g, z0, L) { deck(g, z0, L); }
function buildArch(g, z0, L, H) {
  const N = Math.round(L / 2.2), dz = L / N;
  for (let i = 0; i < N; i++) {
    const s0 = i * dz, s1 = (i + 1) * dz;
    const h0 = H * Math.sin(Math.PI * s0 / L), h1 = H * Math.sin(Math.PI * s1 / L), hm = (h0 + h1) / 2;
    const ang = Math.atan2(h1 - h0, dz), len = Math.hypot(dz, h1 - h0) + 0.06, zc = z0 - (s0 + s1) / 2;
    const parts = [[8, 1.8, hm - 0.9, 0, tileW], [1.0, 0.05, hm + 0.02, 0, tileA]];
    parts.forEach(p => { const m = tbox(p[0], p[1], len, p[4], 0.6); m.position.set(p[3], p[2], zc); m.rotation.x = ang; g.add(m); });
    [-1, 1].forEach(s => { const m = tbox(0.4, 0.55, len, tileW, 0.6); m.position.set(s * 3.8, hm + 0.275, zc); m.rotation.x = ang; g.add(m); });
  }
  slab(g, 8, 13, 2.4, 0, -7.7, z0 - 1.2); slab(g, 8, 13, 2.4, 0, -7.7, z0 - L + 1.2);
  shade(g, 15, L + 6, 0, z0 - L / 2);
}
function buildStairs(g, z0) {
  const n = 24, run = 0.7, rise = 0.22, top = n * rise;
  for (let i = 0; i < n; i++) { const t = (i + 1) * rise; slab(g, 10, t + 3, run, 0, (t - 3) / 2, z0 - (i + 0.5) * run); }
  slab(g, 10, top + 3, 12, 0, (top - 3) / 2, z0 - n * run - 6);
  for (let i = 0; i < n; i++) { const t = top - (i + 1) * rise; slab(g, 10, t + 3, run, 0, (t - 3) / 2, z0 - n * run - 12 - (i + 0.5) * run); }
  const zc = z0 - n * run - 6;
  [-1, 1].forEach(s => pillar(g, 0.45, 6.4, s * 4.4, top + 3.2, zc - 3));
  slab(g, 10.4, 0.6, 1.4, 0, top + 6.7, zc - 3, tileA);
  shade(g, 16, n * run * 2 + 18, 0, z0 - (n * run * 2 + 12) / 2);
}
function buildTunnel(g, z0, L) {
  deck(g, z0, L);
  slab(g, 9.2, 0.6, L, 0, 4.3, z0 - L / 2, tileA);
  const bays = Math.round(L / 6);
  for (let b = 0; b <= bays; b++) [-1, 1].forEach(s => slab(g, 0.8, 4, 0.8, s * 4.1, 2, z0 - b * 6));
  for (let b = 0; b < bays; b++) {
    const zc = z0 - (b + 0.5) * 6;
    [-1, 1].forEach(s => { slab(g, 0.6, 1, 5.2, s * 4.1, 0.5, zc, tileA); slab(g, 0.6, 0.8, 5.2, s * 4.1, 3.6, zc, tileA); });
    const l = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.08, 3.0), lightMat); l.position.set(0, 3.95, zc); g.add(l);
  }
}
function buildPool(g, z0, L) {
  deck(g, z0, L);
  const zc = z0 - L / 2;
  [-1, 1].forEach(s => {
    slab(g, 12, 1.2, L, s * 21, -0.6, zc);
    slab(g, 0.6, 3.5, L, s * 15, -1.75, zc, tileA);
    slab(g, 11, 3.5, 0.6, s * 9.5, -1.75, z0 - 0.3, tileA); slab(g, 11, 3.5, 0.6, s * 9.5, -1.75, z0 - L + 0.3, tileA);
    for (let k = -1; k <= 1; k += 2) {
      const lz = zc + k * 8;
      [-0.3, 0.3].forEach(o => { const p = tcyl(0.04, 0.04, 3.4, 8, chromeMat, 1); p.position.set(s * 14.5, -0.1, lz + o); g.add(p); });
      for (let r = 0; r < 3; r++) { const rg = tcyl(0.03, 0.03, 0.6, 8, chromeMat, 1); rg.rotation.x = Math.PI / 2; rg.position.set(s * 14.5, -1.1 + r * 0.7, lz); g.add(rg); }
    }
  });
  slab(g, 30, 0.5, L, 0, -3.5, zc, tileA);
  const w = new THREE.Mesh(unitPlane, poolWater); w.rotation.x = -Math.PI / 2; w.scale.set(30, L, 1); w.position.set(0, -0.9, zc); g.add(w);
  const c = new THREE.Mesh(unitPlane, causticMat); c.rotation.x = -Math.PI / 2; c.scale.set(30, L, 1); c.position.set(0, -3.2, zc); g.add(c);
  const cx = -21, cz = zc;
  [[-0.5, -0.5], [0.5, -0.5], [-0.5, 0.5], [0.5, 0.5]].forEach(o => slab(g, 0.22, 3.4, 0.22, cx + o[0], 1.7, cz + o[1], chromeMat, 1));
  slab(g, 1.6, 0.14, 1.6, cx, 3.45, cz, tileA, 0.6); slab(g, 1.6, 1.0, 0.12, cx, 4.0, cz - 0.75, tileA, 0.6);
  shade(g, 46, L + 6, 0, zc);
}
function buildColonnade(g, z0, L) {
  deck(g, z0, L);
  for (let z = z0 - 4; z > z0 - L; z -= 8) {
    [-1, 1].forEach(s => { pillar(g, 0.6, 12.2, s * 4.7, 4.9, z); pillar(g, 0.95, 0.5, s * 4.7, 11.3, z, tileA); });
    slab(g, 10.8, 0.8, 1.4, 0, 11.95, z); slab(g, 10.8, 0.12, 1.5, 0, 11.5, z, tileA);
  }
}
function buildAtrium(g, z0, L) {
  deck(g, z0, L);
  const zc = z0 - L / 2;
  slab(g, 70, 0.5, L, 0, -3.5, zc, tileA, 1.2);
