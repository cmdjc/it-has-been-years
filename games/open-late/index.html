<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Open Late</title>
<style>
:root{--ink:#1c2a3a;--cold:#dfe8f1;--soft:#5d7186}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#cdd8e6;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);touch-action:none}
canvas{display:block;position:fixed;inset:0}
#cap{position:fixed;left:50%;bottom:13%;transform:translateX(-50%);max-width:86vw;text-align:center;font-size:clamp(14px,3.8vw,18px);line-height:1.45;letter-spacing:.03em;color:#f3f7fb;background:rgba(24,36,52,.72);padding:.65em 1.2em;opacity:0;transition:opacity .9s ease;pointer-events:none;z-index:2}
#cap.on{opacity:1}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid rgba(28,42,58,.4);display:none;pointer-events:none;z-index:1}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.4);border:1px solid rgba(28,42,58,.5)}
#black{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 3s ease;z-index:3}
#start,#end{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:9vw;background-color:#eef3f8;background-image:linear-gradient(#d3dde8 1px,transparent 1px),linear-gradient(90deg,#d3dde8 1px,transparent 1px);background-size:36px 36px}
#end{display:none;opacity:0;transition:opacity 3s ease;z-index:6;background:#0b1118;color:#dfe8f1}
h1{font-weight:300;font-size:clamp(34px,10vw,62px);letter-spacing:.06em;margin:0 0 .35em}
.sub{font-size:clamp(14px,3.8vw,18px);color:var(--soft);margin:0 0 2.2em;letter-spacing:.04em}
.how{font-size:clamp(14px,3.8vw,16px);line-height:1.8;color:var(--soft);margin:0 0 2.6em;max-width:22em;background:rgba(238,243,248,.9);padding:.4em .8em}
#end p{font-size:clamp(16px,4.4vw,22px);line-height:1.7;color:#b9c8d8;margin:0 0 2.2em;max-width:22em}
button{font:inherit;font-weight:300;font-size:16px;letter-spacing:.22em;color:inherit;background:transparent;border:1px solid currentColor;padding:.9em 2.4em;border-radius:0;cursor:pointer}
button:active{background:rgba(120,150,180,.25)}
@media (prefers-reduced-motion:reduce){#cap,#black,#end{transition-duration:.2s}}
</style>
</head>
<body>
<div id="cap"></div>
<div id="joy"><div id="knob"></div></div>
<div id="black"></div>

<div id="start">
  <h1>OPEN LATE</h1>
  <p class="sub">Everyone here is happy to help.</p>
  <p class="how">Walk to Customer Service.<br>Left thumb walks. Right thumb looks.<br>Keyboard: WASD, drag the mouse to look.<br>Headphones recommended.</p>
  <button id="go">ENTER</button>
</div>
<div id="end">
  <p>Thank you for shopping with us.<br>We hope you found everything you were looking for.</p>
  <button id="again">WALK AGAIN</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);

/* ---------- renderer & scene ---------- */
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }); }

const lamp = new THREE.PointLight(0xeaf3ff, 0.55, 16, 2); scene.add(lamp);

let seed = 90210;

function canvasTex(w, h, draw, rx, ry) {

  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx || 1, ry || 1); t.anisotropy = ANISO; return t;
}
const clampTex = t => { t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; return t; };

/* ---------- the face: the same one, everywhere ---------- */
function drawFace(g, cx, cy, s, eye, mouth) {
  const skin = "#e4c1a7";
  g.lineCap = "round";
  g.strokeStyle = "#5a4333"; g.lineWidth = 4.5 * s;
  [-1, 1].forEach(q => { g.beginPath(); g.moveTo(cx + q * 30 * s, cy - 34 * s); g.quadraticCurveTo(cx + q * 58 * s, cy - 46 * s, cx + q * 84 * s, cy - 30 * s); g.stroke(); });
  [-1, 1].forEach(q => {
    const ex = cx + q * 56 * s, ey = cy - 8 * s;
    if (!eye) {
      g.fillStyle = "#f6f2ee"; g.beginPath(); g.ellipse(ex, ey, 23 * s, 13 * s, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#4b3828"; g.beginPath(); g.arc(ex, ey, 10.5 * s, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#0a0806"; g.beginPath(); g.arc(ex, ey, 4.6 * s, 0, Math.PI * 2); g.fill();
      g.fillStyle = "rgba(255,255,255,.9)"; g.beginPath(); g.arc(ex - 3.5 * s, ey - 4 * s, 2.6 * s, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "#3a2a20"; g.lineWidth = 3 * s; g.beginPath(); g.ellipse(ex, ey, 23 * s, 13 * s, 0, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
      g.strokeStyle = "rgba(150,100,80,.45)"; g.lineWidth = 2 * s; g.beginPath(); g.ellipse(ex, ey + s, 23 * s, 13 * s, 0, Math.PI * 0.1, Math.PI * 0.9); g.stroke();
    } else {
      g.fillStyle = skin; g.beginPath(); g.ellipse(ex, ey, 26 * s, 15 * s, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "#3a2a20"; g.lineWidth = 3 * s; g.beginPath(); g.moveTo(ex - 23 * s, ey); g.quadraticCurveTo(ex, ey + 9 * s, ex + 23 * s, ey); g.stroke();
    }
  });
  g.strokeStyle = "rgba(120,80,60,.28)"; g.lineWidth = 3 * s;
  [-1, 1].forEach(q => { g.beginPath(); g.moveTo(cx + q * 9 * s, cy + 2 * s); g.quadraticCurveTo(cx + q * 15 * s, cy + 18 * s, cx + q * 13 * s, cy + 30 * s); g.stroke(); });
  g.fillStyle = "rgba(95,55,45,.55)";
  [-1, 1].forEach(q => { g.beginPath(); g.ellipse(cx + q * 8 * s, cy + 33 * s, 5.5 * s, 3 * s, 0, 0, Math.PI * 2); g.fill(); });
  const my = cy + 62 * s, hw = 52 * s, top = 10 * s, bot = [18, 28, 50][mouth] * s;
  g.beginPath(); g.moveTo(cx - hw, my - 4 * s); g.quadraticCurveTo(cx, my + top * 2, cx + hw, my - 4 * s); g.quadraticCurveTo(cx, my + bot * 2, cx - hw, my - 4 * s); g.closePath();
  g.fillStyle = mouth === 0 ? "#f3f0e8" : "#3a1b1d"; g.fill();
  g.save(); g.clip();
  g.fillStyle = "#f3f0e8"; g.fillRect(cx - hw, my - 8 * s, 2 * hw, mouth === 0 ? 70 * s : top + 8 * s);
  g.strokeStyle = "#d5cec2"; g.lineWidth = 1.6 * s;
  for (let i = -5; i <= 5; i++) { g.beginPath(); g.moveTo(cx + i * 9 * s, my - 8 * s); g.lineTo(cx + i * 9 * s, my + 40 * s); g.stroke(); }
  if (mouth === 2) { g.fillStyle = "#a64b50"; g.beginPath(); g.ellipse(cx, my + bot * 1.2, 24 * s, 11 * s, 0, 0, Math.PI * 2); g.fill(); }
  g.restore();
  g.strokeStyle = "#a96a68"; g.lineWidth = 4.5 * s; g.beginPath(); g.moveTo(cx - hw, my - 4 * s); g.quadraticCurveTo(cx, my + top * 2, cx + hw, my - 4 * s); g.stroke();
  g.strokeStyle = "#bd817e"; g.lineWidth = 6 * s; g.beginPath(); g.moveTo(cx - hw, my - 4 * s); g.quadraticCurveTo(cx, my + bot * 2, cx + hw, my - 4 * s); g.stroke();
  g.fillStyle = "rgba(120,70,60,.5)";
  [-1, 1].forEach(q => { g.beginPath(); g.arc(cx + q * (hw + 3 * s), my - 6 * s, 3.2 * s, 0, Math.PI * 2); g.fill(); });
}
const faceTex = [0, 1].map(eye => [0, 1, 2].map(mouth => {
  const t = canvasTex(1024, 512, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#e7c8b0"); gr.addColorStop(1, "#dcb69c");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const hl = g.createRadialGradient(256, 230, 10, 256, 250, 190); hl.addColorStop(0, "rgba(255,255,255,.22)"); hl.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = hl; g.fillRect(0, 0, w, h);
    drawFace(g, 256, 252, 1, eye, mouth);
  });
  t.wrapS = THREE.RepeatWrapping; return t;
}));

/* ---------- TV + posters ---------- */
const tvCanvas = document.createElement("canvas"); tvCanvas.width = 256; tvCanvas.height = 144;
const tvCtx = tvCanvas.getContext("2d");
const tvTex = new THREE.CanvasTexture(tvCanvas);
const tvMat = new THREE.MeshBasicMaterial({ map: tvTex });
function drawTV(t, eye) {
  const g = tvCtx, ph = (t / 3) % 3 | 0;
  g.fillStyle = "#0d1c2e"; g.fillRect(0, 0, 256, 144);
  if (ph === 0) {
    g.fillStyle = "#e4c1a7"; g.beginPath(); g.ellipse(128, 74, 62, 78, 0, 0, Math.PI * 2); g.fill();
    drawFace(g, 128, 66, 0.6, eye, Math.sin(t * 1.4) > 0.75 ? 1 : 0);
  } else {
    g.fillStyle = "#f2f6fa"; g.font = "bold 22px Helvetica, Arial"; g.textAlign = "center";
    g.fillText(ph === 1 ? "WELCOME" : "WE'RE HAPPY", 128, 64); g.fillText(ph === 1 ? "" : "TO HELP", 128, 94);
  }
  g.fillStyle = "rgba(255,255,255,.04)"; for (let y = 0; y < 144; y += 4) g.fillRect(0, y, 256, 1);
  tvTex.needsUpdate = true;
}
const posterTex = ["WE'RE HAPPY TO HELP.", "PLEASE SMILE.", "ASK ANY ASSOCIATE."].map(txt => clampTex(canvasTex(256, 384, (g, w, h) => {
  g.fillStyle = "#e6eef6"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#e4c1a7"; g.beginPath(); g.ellipse(128, 148, 82, 102, 0, 0, Math.PI * 2); g.fill();
  drawFace(g, 128, 140, 0.8, 0, 0);
  g.fillStyle = "#1c2a3a"; g.font = "bold 22px Helvetica, Arial"; g.textAlign = "center"; g.fillText(txt, 128, 320);
  g.fillStyle = "#5d7186"; g.font = "13px Helvetica, Arial"; g.fillText("Open late. Always.", 128, 350);
})));
const textCache = {};
function textTex(txt, bg, fg, w, h, size) {
  const key = txt + bg + fg; if (textCache[key]) return textCache[key];
  return textCache[key] = clampTex(canvasTex(w || 512, h || 128, (g, W, H) => {
    g.fillStyle = bg; g.fillRect(0, 0, W, H); g.fillStyle = fg; g.font = "bold " + (size || 54) + "px Helvetica, Arial"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(txt, W / 2, H / 2 + 3);
  }));
}

/* ---------- materials & geometry helpers ---------- */
const floorTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = "#cbd6e2"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(${150 + Math.random() * 60 | 0},${170 + Math.random() * 60 | 0},${190 + Math.random() * 60 | 0},.12)`; g.fillRect(Math.random() * w, Math.random() * h, 6, 6); }
  g.fillStyle = "#aebccb"; g.fillRect(0, 0, w, 2); g.fillRect(0, 0, 2, h);
});
const ceilTex = canvasTex(64, 64, (g, w, h) => { g.fillStyle = "#e8eef4"; g.fillRect(0, 0, w, h); g.fillStyle = "#c7d1dc"; g.fillRect(0, 0, w, 2); g.fillRect(0, 0, 2, h); });
const wallTex = canvasTex(64, 64, (g, w, h) => { g.fillStyle = "#e2e9f1"; g.fillRect(0, 0, w, h); g.fillStyle = "rgba(160,180,200,.18)"; g.fillRect(0, 0, w, 5); });
const stepTex = canvasTex(8, 64, (g, w, h) => { g.fillStyle = "#a5b1bf"; g.fillRect(0, 0, w, h); g.fillStyle = "#6d7a8a"; g.fillRect(0, 44, w, 20); });
const lm = c => new THREE.MeshLambertMaterial({ color: c });
const floorMat = new THREE.MeshPhongMaterial({ map: floorTex, shininess: 80, specular: 0x8da0b4 });
const ceilMat = new THREE.MeshLambertMaterial({ map: ceilTex });
const wallMat = new THREE.MeshLambertMaterial({ map: wallTex });
const stepMat = new THREE.MeshLambertMaterial({ map: stepTex });
const panelMat = new THREE.MeshBasicMaterial({ color: 0xf6fbff });
const M = {
  white: lm(0xf1f5f9), shelf: lm(0xd3dbe5), metal: lm(0x9aa8b8), dark: lm(0x38465a), navy: lm(0x2d3b55), black: lm(0x1a222c),
  wood: lm(0xcbbfae), rug: lm(0xb8c6d6), plain: new THREE.MeshLambertMaterial({ color: 0xffffff }),
  glass: new THREE.MeshLambertMaterial({ color: 0xbfe0f0, transparent: true, opacity: 0.3, depthWrite: false })
};
const PAL = [0x8fb8d8, 0xb7a5cf, 0x9fc3b4, 0xc9b9a0, 0xa4b0c8, 0xd0a9a9, 0x8da2b8, 0xcfd2d6, 0x7f93a8];

function tbox(w, h, d, mat, rs) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv, dm = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * dm[f][0] / rs, uv.getY(k) * dm[f][1] / rs); }
  return new THREE.Mesh(g, mat);
}
function bx(g, w, h, d, x, y, z, mat, rs) { const m = tbox(w, h, d, mat || M.white, rs || 1); m.position.set(x, y, z); g.add(m); return m; }
function cyl(g, r, h, x, y, z, mat, seg) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg || 10), mat || M.metal); m.position.set(x, y, z); g.add(m); return m; }
const dummy = new THREE.Object3D();
function inst(g, geo, items) {
  geo.userData.shared = true;
  const m = new THREE.InstancedMesh(geo, M.plain, items.length);
  items.forEach((it, i) => {
    dummy.position.set(it.x, it.y, it.z); dummy.rotation.set(0, it.ry || 0, 0); dummy.scale.set(it.sx || 1, it.sy || 1, it.sz || 1); dummy.updateMatrix();
    m.setMatrixAt(i, dummy.matrix); m.setColorAt(i, new THREE.Color(it.c));
  });
  m.frustumCulled = false; g.add(m); return m;
}
const unitBox = new THREE.BoxGeometry(1, 1, 1), unitCyl = new THREE.CylinderGeometry(1, 1, 1, 10);
unitBox.userData.shared = true; unitCyl.userData.shared = true;

/* ---------- people ---------- */
const G = {
  leg: new THREE.CylinderGeometry(0.085, 0.07, 0.85, 10), torso: new THREE.CylinderGeometry(0.17, 0.145, 0.62, 12),
  arm: new THREE.CylinderGeometry(0.05, 0.042, 0.62, 8), hand: new THREE.SphereGeometry(0.052, 8, 6),
  neck: new THREE.CylinderGeometry(0.05, 0.055, 0.15, 8), head: new THREE.SphereGeometry(0.115, 28, 20),
  hair: new THREE.SphereGeometry(0.123, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.52), tag: new THREE.BoxGeometry(0.07, 0.035, 0.01)
};
Object.values(G).forEach(g => g.userData.shared = true);
const SKIN = [0xffffff, 0xf0dccd, 0xd9b9a2, 0xb48a6c];
const HAIR = [0x2a2018, 0x5a4332, 0x8a6a45, 0xb7a78f, 0x1c1c20, 0x6d3f2a];
const CLOTH = [0x7d93ab, 0x9a8fb0, 0x8fb0a5, 0xb59a8f, 0x6f7f95, 0xa9b4c3, 0x8a8a96];
const figs = [];
const dollMat = new THREE.MeshLambertMaterial({ map: faceTex[0][0] });
let eyeState = 0;

function makeFig(chunk, lx, lz, o) {
  o = o || {};
  const g = new THREE.Group(), sc = 0.94 + rand() * 0.14; g.scale.setScalar(sc);
  const skin = lm(pick(SKIN).valueOf());
  const cloth = lm(o.assoc ? 0x2d3b55 : pick(CLOTH)), pants = lm(o.assoc ? 0x22304a : 0x4a566a);
  const mk = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); g.add(m); return m; };
  [-0.1, 0.1].forEach(x => mk(G.leg, pants, x, 0.425, 0));
  const torso = mk(G.torso, cloth, 0, 1.16, 0); torso.scale.set(1.12, 1, 0.72);
  if (o.assoc) { mk(G.torso, lm(0xeef2f6), 0, 1.16, 0.01).scale.set(0.9, 0.98, 0.62); torso.scale.set(1.14, 1, 0.74); mk(G.tag, M.white, 0.1, 1.34, 0.12); }

    g, pivot, torso, headMat, mouth: 0, headYaw: 0, wx: lx, wz: chunk.z0 + lz, wy: chunk.y0, cool: 3 + rand() * 8, act: null,
    f0: 150 + rand() * 90, sc, tint: 0

function setMouth(f, m) { if (f.mouth !== m) { f.mouth = m; f.headMat.map = faceTex[eyeState][m]; } }

/* ---------- department builders (local coords: x -10..10, z 0..-24, floor y 0) ---------- */
const CH = 24, NCH = 41, HALFW = 3.8, WALLX = 10.3;
const SIGN = { home: "HOME & BEDDING", menswear: "MEN", electronics: "ELECTRONICS", toys: "TOYS", shoes: "FOOTWEAR", furniture: "FURNITURE", checkout: "CHECKOUT", cosmetics: "BEAUTY" };
const B = {};

B.cosmetics = (c) => {
  const g = c.g, items = [], shelf = [];
  [-1, 1].forEach(s => {
    bx(g, 1.3, 1.0, 20, s * 6, 0.5, -12, M.white); bx(g, 1.3, 0.45, 20, s * 6, 1.22, -12, M.glass);
    bx(g, 0.5, 3.4, 20, s * 9.7, 1.7, -12, M.shelf); bx(g, 0.1, 3.1, 20, s * 9.4, 1.7, -12, panelMat);
    for (let z = -2; z > -22; z -= 0.7) { items.push({ x: s * 6 + (rand() - 0.5) * 0.7, y: 1.55, z: z + rand() * 0.3, sx: 0.07, sy: 0.22 + rand() * 0.1, sz: 0.07, c: pick(PAL) }); }
    for (let k = 0; k < 3; k++) for (let z = -1.5; z > -22; z -= 0.6) shelf.push({ x: s * 9.3, y: 0.9 + k * 0.9, z, sx: 0.12, sy: 0.3, sz: 0.12, c: pick(PAL) });
    makeFig(c, s * 7.4, -6 - rand() * 12, { assoc: true, face: -s * Math.PI / 2 });

};
B.home = (c) => {
  const g = c.g;
  [-1, 1].forEach(s => {
    for (let k = 0; k < 4; k++) {
      const z = -3 - k * 5.6, x = s * 6.6;
      bx(g, 2.3, 0.3, 2.5, x, 0.25, z, M.wood); bx(g, 2.0, 0.5, 2.3, x, 0.65, z, M.white); bx(g, 2.0, 0.1, 1.3, x, 0.93, z + 0.5, lm(pick(PAL)));
      bx(g, 0.15, 1.1, 2.3, x + s * 1.1, 0.9, z, M.wood); [-0.45, 0.45].forEach(o => bx(g, 0.45, 0.18, 0.7, x - s * 0.7, 1.0, z + o, M.white));
      bx(g, 3.2, 0.02, 3.4, x - s * 0.1, 0.02, z, M.rug);
      cyl(g, 0.05, 0.7, x + s * 1.5, 0.45, z - 1.5, M.metal); cyl(g, 0.2, 0.28, x + s * 1.5, 0.95, z - 1.5, M.white);
    }

};

  for (const t of e.changedTouches) {
    if (t.identifier === joyId) { let dx = t.clientX - jox, dy = t.clientY - joy0; const m = Math.hypot(dx, dy), R = 55; if (m > R) { dx = dx / m * R; dy = dy / m * R; } jx = dx / R; jy = -dy / R; knob.style.transform = `translate(${dx}px,${dy}px)`; }
    else if (t.identifier === lookId) { look(t.clientX - lx, t.clientY - ly, 0.0052); lx = t.clientX; ly = t.clientY; }
  }
}, { passive: false });
function endTouch(e) { for (const t of e.changedTouches) { if (t.identifier === joyId) { joyId = null; jx = jy = 0; joyEl.style.display = "none"; } if (t.identifier === lookId) lookId = null; } }
cv.addEventListener("touchend", endTouch); cv.addEventListener("touchcancel", endTouch);

/* ---------- captions / announcements ---------- */
let capTimer = 0;
function say(t, dur) { const c = $("cap"); c.textContent = t; c.classList.add("on"); clearTimeout(capTimer); capTimer = setTimeout(() => c.classList.remove("on"), (dur || 6) * 1000); }
const PA = [[2, "Attention shoppers: the store is now open late."], [8, "Associates are standing by to help you."], [14, "Please remember to smile."], [20, "Have you found everything you were looking for?"], [27, "Your associate will be with you shortly."], [34, "Please proceed to Customer Service."]];
const paDone = {};

/* ---------- the almost-speaking ---------- */
function patternFor(L) {
  if (L < 0.12) return null;
  if (L < 0.3) return [{ v: "e", d: 0.3 }];
  if (L < 0.5) return [{ v: "e", d: 0.1, h: 1 }, { v: "e", d: 0.3 }];
  if (L < 0.7) return [{ v: "e", d: 0.12, h: 1 }, { v: "e", d: 0.2 }, { v: "u", d: 0.26 }];
  if (L < 0.88) return [{ v: "a", d: 0.14 }, { v: "e", d: 0.1 }, { v: "a", d: 0.18 }, { v: "i", d: 0.26 }];
  return [{ v: "a", d: 0.12 }, { v: "e", d: 0.1 }, { v: "a", d: 0.14 }, { v: "i", d: 0.16 }, { v: "e", d: 0.1 }, { v: "o", d: 0.24 }];
}
function startAttempt(f, dist, pan) {
  const pat = patternFor(progress);
  const dur = pat ? pat.reduce((a, p) => a + p.d, 0) : 0.9;
  f.act = { t0: T, pat, dur, vstart: 0.85 };
  if (AC) {
    burst(0.45, 900, 0.05 / (1 + dist * 0.2), 0.5, "bandpass", pan);
    if (pat) voice(pat, f.f0, pan, 0.2 / (1 + dist * 0.3), 0.85);
  }
}
function updateAct(f, dt) {
  const a = f.act; if (!a) return;
  const t = T - a.t0;
  if (t < 0.5) { f.torso.scale.x = (f.torso.userData.bx || (f.torso.userData.bx = f.torso.scale.x)) * (1 + 0.07 * (t / 0.5)); setMouth(f, 0); }
  else if (t < a.vstart) setMouth(f, 1);
  else if (t < a.vstart + a.dur) { const k = (t - a.vstart) % 0.34; setMouth(f, a.pat ? (k < 0.2 ? 2 : 1) : 1); }
  else { setMouth(f, 0); f.pivot.rotation.z = 0.1 + 0.06; f.act = null; f.torso.scale.x = f.torso.userData.bx || f.torso.scale.x; }
}

/* ---------- ending ---------- */
function startEnding() {
  ending = true; locked = true; endT = 0;
  say("Can I help you?", 8);
  chime();
  setTimeout(() => { try { const u = new SpeechSynthesisUtterance("Can I help you?"); u.rate = 0.8; u.pitch = 0.85; u.volume = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }, 700);
  for (const f of figs) if (Math.hypot(f.wx - player.x, f.wz - player.z) < 40) {
    f.act = null; setMouth(f, 2);
    if (AC) voice([{ v: "o", d: 0.4 }], f.f0 * (0.9 + Math.random() * 0.2), Math.max(-1, Math.min(1, (f.wx - player.x) / 8)), 0.09, 0.8 + Math.random() * 0.4, 7);
  }
}
function runEnding(dt) {
  endT += dt;
  if (endT > 5) { const k = Math.max(0, 1 - (endT - 5) / 4); panelMat.color.setScalar(k * (Math.random() < 0.15 ? 0.3 : 1)); hemi.intensity = 0.15 + 0.9 * k; scene.fog.color.setScalar(0.8 * k + 0.02); scene.background.copy(scene.fog.color); }
  if (endT > 7 && !runEnding.s1) { runEnding.s1 = true; say("We're happy to help.", 6); }
  if (endT > 11 && !runEnding.s2) { runEnding.s2 = true; $("black").style.opacity = 1; }
  if (endT > 15 && !runEnding.s3) { runEnding.s3 = true; const e = $("end"); e.style.display = "flex"; requestAnimationFrame(() => e.style.opacity = 1); duck(0, 4); }
}
function duck(v, sec) { if (AC) { master.gain.cancelScheduledValues(AC.currentTime); master.gain.setValueAtTime(master.gain.value, AC.currentTime); master.gain.linearRampToValueAtTime(v, AC.currentTime + sec); } }

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
let nextBlink = 3, blinkEnd = 0, tvT = 0, qAcc = 0, qN = 0, qTries = 0;
const wrapA = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };

function update(dt) {
  T += dt;
  let fwd = jy, str = jx;
  if (!locked) {
    if (keys.KeyW || keys.ArrowUp) fwd += 1; if (keys.KeyS || keys.ArrowDown) fwd -= 1;
    if (keys.KeyD || keys.ArrowRight) str += 1; if (keys.KeyA || keys.ArrowLeft) str -= 1;
  } else { fwd = 0; str = 0; }
  const m = Math.hypot(fwd, str); if (m > 1) { fwd /= m; str /= m; }
  speedNow += (Math.min(1, m) * ((keys.ShiftLeft || keys.ShiftRight) ? 4.2 : 2.3) - speedNow) * Math.min(1, dt * 4);
  const sy = Math.sin(yaw), cy = Math.cos(yaw);
  const dx = -sy * fwd + cy * str, dz = -cy * fwd - sy * str, dl = Math.hypot(dx, dz) || 1, step = m > 0.01 ? speedNow * dt : 0;
  let nx = player.x + dx / dl * step, nz = player.z + dz / dl * step;
  nx = Math.max(-HALFW, Math.min(HALFW, nx)); nz = Math.min(-1, Math.max(-(NCH * CH) + 5.6, nz));
  for (const f of figs) {
    const ex = nx - f.wx, ez = nz - f.wz;
    if (Math.abs(ez) < 0.7 && Math.abs(ex) < 0.7) { const d = Math.hypot(ex, ez) || 0.01; if (d < 0.55) { nx = f.wx + ex / d * 0.55; nz = f.wz + ez / d * 0.55; } }
  }
  nx = Math.max(-HALFW, Math.min(HALFW, nx));
  player.x = nx; player.z = nz;
  const ci = Math.max(0, Math.min(NCH - 1, Math.floor(-player.z / CH)));
  ensure(ci, 1);
  progress = Math.min(1, -player.z / (NCH * CH));
  player.y += (groundH(player.z) - player.y) * Math.min(1, dt * 9);
  stepPhase += speedNow * dt * 1.8; const sv = Math.sin(stepPhase);
  if (speedNow > 0.4 && lastSin * sv < 0) stepSound(); lastSin = sv;
  const bob = Math.abs(Math.sin(stepPhase)) * 0.035 * Math.min(1, speedNow / 2.3);
  camera.position.set(player.x, player.y + 1.65 - bob, player.z); camera.rotation.set(pitch, yaw, 0);
  lamp.position.set(player.x, player.y + 2.4, player.z);

  /* blinking, in unison */
  if (T > nextBlink) { blinkEnd = T + 0.14; nextBlink = T + 4 + Math.random() * 4; }
  const ne = T < blinkEnd ? 1 : 0;
  if (ne !== eyeState) { eyeState = ne; for (const f of figs) f.headMat.map = faceTex[eyeState][f.mouth]; dollMat.map = faceTex[eyeState][0]; }
  /* breathing, in unison */
  const br = 1 + 0.012 * Math.sin(T * 1.6);

  for (const f of figs) {
    const dxp = player.x - f.wx, dzp = player.z - f.wz, dist = Math.hypot(dxp, dzp);
    if (dist > 45) continue;
    const rel = Math.max(-1.7, Math.min(1.7, wrapA(Math.atan2(dxp, dzp) - f.g.rotation.y)));
    f.headYaw += Math.max(-1, Math.min(1, (rel - f.headYaw) * 2)) * 1.1 * dt;
    f.pivot.rotation.y = f.headYaw;
    if (Math.abs(f.headYaw) > 0.55) f.g.rotation.y += Math.sign(f.headYaw) * 0.18 * dt;
    f.torso.scale.y = br; f.pivot.rotation.z += (0.1 - f.pivot.rotation.z) * Math.min(1, dt * 2);
    if (f.act) updateAct(f, dt);
    else if (!ending) {
      f.cool -= dt;
      if (f.cool <= 0 && dist < 7.5) {
        startAttempt(f, dist, Math.max(-1, Math.min(1, Math.sin(wrapA(Math.atan2(-dxp, -dzp) - yaw)))));
        f.cool = (7 + Math.random() * 7) * (1 - 0.5 * progress);
      }
    }
  }
  if (tvActive) { tvT += dt; if (tvT > 0.12) { tvT = 0; drawTV(T, eyeState); } }
  panelMat.color.setScalar(ending ? panelMat.color.r : (Math.random() < 0.004 ? 0.72 : 0.97 + 0.03 * Math.sin(T * 40)));

  for (const [at, txt] of PA) if (!paDone[at] && ci >= at) { paDone[at] = true; chime(); say(txt, 7); }
  if (!ending && player.z < -(NCH - 1) * CH - 18 + 4.5) startEnding();
  if (ending) runEnding(dt);
}
function frame() {
  requestAnimationFrame(frame);
  const raw = clock.getDelta(), dt = Math.min(0.05, raw);
  if (started) {
    update(dt);
    if (qTries < 3) { qAcc += raw; qN++; if (qAcc > 2.5) { if (qN / qAcc < 38 && PR > 0.8) { PR = Math.max(0.8, PR * 0.75); renderer.setPixelRatio(PR); renderer.setSize(innerWidth, innerHeight); qTries++; } else qTries = 3; qAcc = 0; qN = 0; } }
  } else { camera.position.set(0, 1.65, -2); camera.rotation.set(0, 0, 0); ensure(0, 99); if (tvActive) drawTV(0, 0); }
  renderer.render(scene, camera);
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
document.addEventListener("visibilitychange", () => { if (AC) { if (document.hidden) AC.suspend(); else AC.resume(); } });
addEventListener("contextmenu", e => e.preventDefault());
$("go").addEventListener("click", () => {
  initAudio(); if (AC && AC.state === "suspended") AC.resume();
  $("start").style.display = "none"; started = true; clock.getDelta();
});
$("again").addEventListener("click", () => location.reload());
ensure(0, 99);
frame();
})();
</script>
</body>
</html>
